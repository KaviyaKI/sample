name: .NET CI/CD

on:
  push:
    branches:
      - main

jobs:
  # =========================
  # CI - Build and Test
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore learningprojectserver.sln

      - name: Build
        run: dotnet build learningprojectserver.sln --no-restore

      - name: Run tests
        run: dotnet test learningprojectserver.sln --no-build

      - name: Publish application
        run: dotnet publish learningprojectserver.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: learningprojectserver
          path: ./publish


  # =========================
  # CD - Deploy to Windows
  # =========================
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: learningprojectserver
          path: ./publish

      - name: Deploy application
        shell: powershell
        run: |
          $deployPath = "C:\Deployments\learningprojectserver"

          if (!(Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath -Force
          }

          Copy-Item ".\publish\*" $deployPath -Recurse -Force

          Write-Host "Application deployed successfully to $deployPath"